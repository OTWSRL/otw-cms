# Updates the CMS and its plugins in a pull request, or adds or removes a plugin in one. Run it
# from the admin (Dashboard › Updates and Plugins › Add Plugin, with CMS_GITHUB_REPO and
# CMS_GITHUB_TOKEN set on the site), from the Actions tab, or on the schedule below. Merging the
# pull request deploys the change; build:deploy migrates.
name: CMS updates

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Plugins to update, or "core"; empty for everything
        required: false
        default: ''
      plugins_only:
        description: Leave the CMS itself where it is
        type: boolean
        default: false
      add_plugin:
        description: A plugin's npm package to add, instead of updating
        required: false
        default: ''
      remove_plugin:
        description: An installed plugin's package to remove, instead of updating
        required: false
        default: ''
  schedule:
    # Weekly. Remove to propose updates only when asked.
    - cron: '23 5 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: cms-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # For plugins from a private registry, read as ${NPM_TOKEN} in .npmrc.
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: '{{ci_install}}'
      - name: Update
        env:
          # Through the environment, not pasted into the script.
          PACKAGES: ${{ inputs.packages }}
          PLUGINS_ONLY: ${{ inputs.plugins_only && '--plugins-only' || '' }}
          ADD_PLUGIN: ${{ inputs.add_plugin }}
          REMOVE_PLUGIN: ${{ inputs.remove_plugin }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$ADD_PLUGIN" ]; then
            {{exec}} cms plugin add "$ADD_PLUGIN" --commit
          elif [ -n "$REMOVE_PLUGIN" ]; then
            {{exec}} cms plugin remove "$REMOVE_PLUGIN" --commit
          else
            # Word splitting on purpose: PACKAGES is a space-separated list.
            {{exec}} cms update $PACKAGES $PLUGINS_ONLY --commit
          fi
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="$(git branch --show-current)"
          if [ "$branch" = "$GITHUB_REF_NAME" ]; then
            echo "Nothing to update."
            exit 0
          fi
          git push origin "$branch"
          gh pr create --head "$branch" --title "$(git log -1 --format=%s)" \
            --body "Opened by the CMS updates workflow. Merging deploys it; database changes run in the deploy step (build:deploy)."
